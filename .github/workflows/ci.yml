# Mỗi Pull Request vào main / develop tự build và chạy toàn bộ test; PR làm hỏng build sẽ báo đỏ trước khi merge.
name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build và test
        run: mvn -B -ntp clean package
