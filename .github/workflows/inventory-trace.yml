name: Kiểm tra giao diện lô và thẻ kho

on:
  pull_request:
    branches: [main, develop]

jobs:
  inventory-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm tra tồn mẫu, lọc kỳ và hạn dùng
        run: node --test src/test/js/inventory-trace.test.cjs
